version: '3.8'
services:
  proxy-reverso-cliente1:
    image: nginx:latest
    container_name: proxy-reverso-cliente1
    ports:
    - 80:80
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
    - portal-cliente1
    - hotsite-cliente1
    - sign-cliente1
    networks:
    - cliente1_net
  portal-cliente1:
    build: ./portal
    container_name: portal-cliente1
    networks:
    - cliente1_net
  hotsite-cliente1:
    build: ./hotsite
    container_name: hotsite-cliente1
    networks:
    - cliente1_net
  sign-cliente1:
    build: ./sign
    container_name: sign-cliente1
    networks:
    - cliente1_net
networks:
  cliente1_net:
    driver: bridge
